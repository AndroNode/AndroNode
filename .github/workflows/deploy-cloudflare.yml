name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testnet
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy from GitHub."
          fi
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ok == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.check.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: steps.check.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.ok == 'true'
        name: Build website
        run: pnpm --filter @andronode/web build
        env:
          PUBLIC_ESCROW_ADDRESS: ${{ vars.ESCROW_ADDRESS }}
      - if: steps.check.outputs.ok == 'true'
        name: Test API
        run: pnpm --filter @andronode/api test
      - if: steps.check.outputs.ok == 'true'
        name: Provision D1, R2, KV and Queues
        working-directory: apps/api
        run: node scripts/provision.mjs
      - if: steps.check.outputs.ok == 'true'
        name: Apply D1 migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply andronode --remote --config wrangler.deploy.jsonc
      - if: steps.check.outputs.ok == 'true'
        name: Deploy Worker
        id: deploy
        working-directory: apps/api
        run: |
          set -o pipefail
          VARS=(--var "ESCROW_ADDRESS:${{ vars.ESCROW_ADDRESS }}" --var "USDC_ADDRESS:${{ vars.USDC_ADDRESS }}" --var "ADMIN_ADDRESSES:${{ vars.ADMIN_ADDRESSES }}" --var "VERIFIER_MODE:${{ vars.VERIFIER_MODE || 'fixture' }}" --var "ALLOW_MOCK_FUNDING:${{ vars.ALLOW_MOCK_FUNDING || 'true' }}")
          ORIGIN="${{ vars.SITE_ORIGIN }}"
          OUT=$(npx wrangler deploy --config wrangler.deploy.jsonc "${VARS[@]}" ${ORIGIN:+--var "SITE_ORIGIN:$ORIGIN"} 2>&1 | tee /dev/stderr)
          URL=$(echo "$OUT" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          if [ -z "$ORIGIN" ] && [ -n "$URL" ]; then
            echo "SITE_ORIGIN not set; redeploying with $URL so wallet sign-in matches the domain"
            npx wrangler deploy --config wrangler.deploy.jsonc "${VARS[@]}" --var "SITE_ORIGIN:$URL"
          fi
          echo "url=${ORIGIN:-$URL}" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ok == 'true'
        name: Ensure Worker secrets
        working-directory: apps/api
        run: node scripts/ensure-secrets.mjs wrangler.deploy.jsonc
        env:
          BASE_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          VERIFIER_URL: ${{ secrets.VERIFIER_URL }}
          VERIFIER_TOKEN: ${{ secrets.VERIFIER_TOKEN }}
      - if: steps.check.outputs.ok == 'true'
        name: Smoke test
        run: |
          sleep 5
          curl -fsS "${{ steps.deploy.outputs.url }}/v1/health"
          curl -fsS -o /dev/null "${{ steps.deploy.outputs.url }}/"
          echo "### Deployed: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
